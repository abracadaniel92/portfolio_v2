<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#0b0b0a" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;800;900&family=IBM+Plex+Mono:wght@400;500&family=Instrument+Serif:ital@1&display=swap"
      rel="stylesheet"
    />
    <!--
      PRERENDER-MANAGED BLOCK. scripts/prerender.mjs replaces everything between
      the two markers below, once per route, so /blog and each post get their own
      title, description, canonical and social tags. The values here are the
      homepage's, and are also what the dev server shows.

      Edit homepage metadata here. Per-post metadata comes from the frontmatter
      in blog/*.md. Social URLs stay absolute (CLAUDE.md rule 6).

      The prerender also appends a JSON-LD block per route (Person + WebSite +
      ProfilePage here, BlogPosting + BreadcrumbList on a post). It is generated
      from the same data, so it is not duplicated here; the dev server is the
      only place without it.
    -->
    <!-- head:meta:start -->
    <title>Goce Mojsoski · Product &amp; Delivery</title>

    <meta
      name="description"
      content="Product and delivery leader. A decade shipping products, teams and outcomes across cloud, SaaS and commerce, US and Europe."
    />
    <meta name="author" content="Goce Mojsoski" />
    <meta
      name="robots"
      content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1"
    />
    <link rel="canonical" href="https://gmojsoski.com/" />
    <link
      rel="alternate"
      type="application/rss+xml"
      title="Blog · Goce Mojsoski"
      href="https://gmojsoski.com/rss.xml"
    />

    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://gmojsoski.com/" />
    <meta property="og:site_name" content="Goce Mojsoski" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:title" content="Goce Mojsoski · Product & Delivery Leader" />
    <meta
      property="og:description"
      content="A decade shipping products, teams and outcomes across cloud, SaaS and commerce, US and Europe."
    />
    <meta property="og:image" content="https://gmojsoski.com/og-image.png" />
    <meta
      property="og:image:alt"
      content="Goce Mojsoski, product and delivery leader"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Goce Mojsoski · Product & Delivery Leader" />
    <meta
      name="twitter:description"
      content="A decade shipping products, teams and outcomes across cloud, SaaS and commerce, US and Europe."
    />
    <meta name="twitter:image" content="https://gmojsoski.com/og-image.png" />
    <meta
      name="twitter:image:alt"
      content="Goce Mojsoski, product and delivery leader"
    />
    <!-- head:meta:end -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- GoatCounter (self-hosted). Fails silently if blocked; CSP must allow
         analytics.gmojsoski.com in script-src, connect-src and img-src (see DEPLOY.md). -->
    <script
      data-goatcounter="https://analytics.gmojsoski.com/count"
      async
      src="https://analytics.gmojsoski.com/count.js"
    ></script>
  </body>
</html>
